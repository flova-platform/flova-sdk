[platformio]
default_envs = universal-esp32

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@6.21.5
lib_extra_dirs = packages
  third_party
  protocol/generated
lib_ignore =
  flova-linux
build_flags =
  -Ipackages/flova-embedded-sdk/include
  -Ipackages/flova-arduino/include
  -Ipackages/flova-esp32/include
  -Ipackages/flova-esp8266/include
  -DFLOVA_ESP8266_TLS_TX_BYTES=512
  -fno-exceptions

[esp32_profile]
build_flags =
  -DFLOVA_DATASTREAM_CAPACITY=64
  -DFLOVA_TEXT_CAPACITY=96
  -DFLOVA_HISTORY_CAPACITY=32
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=8
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=8
  -fstack-usage

[esp32_ble_profile]
; BLE/BTDM consumes a large fixed DRAM budget while provisioning. Keep the
; BLE universal image bounded for the ESP32 DevKit and leave SoftAP capacity
; unchanged in esp32_profile.
build_flags =
  -DFLOVA_DATASTREAM_CAPACITY=12
  -DFLOVA_TEXT_CAPACITY=64
  -DFLOVA_HISTORY_CAPACITY=8
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=4
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=4
  -fstack-usage

[esp8266_profile]
build_flags =
  -DFLOVA_DATASTREAM_CAPACITY=4
  -DFLOVA_MAX_ACTIVE_DATASTREAMS_LIMIT=4
  -DFLOVA_TEXT_CAPACITY=48
  -DFLOVA_HISTORY_CAPACITY=4
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=2
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=2
  -fstack-usage

[esp8266_universal_profile]
; The shipped universal image uses the verified 64-entry stock-DRAM profile.
; Keep the application-facing ESP8266 profile above conservative for custom
; sketches that do not need the universal configuration registry.
build_flags =
  ${env.build_flags}
  -DFLOVA_DATASTREAM_CAPACITY=64
  -DFLOVA_MAX_ACTIVE_DATASTREAMS_LIMIT=64
  -DFLOVA_TEXT_CAPACITY=48
  -DFLOVA_HISTORY_CAPACITY=4
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=2
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=2
  -DFLOVA_ESP8266_BOUNDED_TLS_RECORDS=1
  -fstack-usage

[env:universal-esp32]
platform = espressif32@7.0.1
board = esp32dev
; Optimize across the SDK/codec boundaries with this pinned toolchain.
; The framework adds -fno-lto at link time unless explicitly removed.
build_unflags = -fno-lto
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
  -flto
  -ffat-lto-objects
  -DFLOVA_OTA_METADATA_ENABLED=1
  -DFLOVA_FIRMWARE_TARGET=\"universal_esp32\"
  -DFLOVA_OTA_BOOT_LAYOUT_VERSION=\"esp32-ab\"
build_src_filter = +<../examples/universal-esp32/src/main.cpp>

[env:universal-esp32-guardrails]
extends = env:universal-esp32
build_flags =
  ${env:universal-esp32.build_flags}
  -DFLOVA_OFFLINE_GUARDRAIL_CAPACITY=2

[env:universal-esp32-ble]
platform = espressif32@7.0.1
board = esp32dev
board_build.partitions = partitions/esp32-ab-4m-v1.csv
build_flags =
  ${env.build_flags}
  ${esp32_ble_profile.build_flags}
  -DFLOVA_OTA_METADATA_ENABLED=1
  -DFLOVA_FIRMWARE_TARGET=\"universal_esp32_ble\"
  -DFLOVA_OTA_BOOT_LAYOUT_VERSION=\"esp32-ab-4m-v1\"
build_src_filter = +<../examples/universal-esp32-ble/src/main.cpp>

[env:universal-esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
monitor_speed = 115200
extra_scripts = post:scripts/esp8266_universal_link.py
build_flags =
  ${env.build_flags}
  ${esp8266_universal_profile.build_flags}
  -DFLOVA_OTA_METADATA_ENABLED=1
  -DFLOVA_FIRMWARE_TARGET=\"universal_esp8266\"
  -DFLOVA_OTA_BOOT_LAYOUT_VERSION=\"esp8266-staged-copy\"
build_src_filter = +<../examples/universal-esp8266/src/main.cpp>

[env:universal-esp8266-guardrails]
extends = env:universal-esp8266
build_flags =
  ${env:universal-esp8266.build_flags}
  -DFLOVA_OFFLINE_GUARDRAIL_CAPACITY=2

[env:scheduling-smoke-esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  -DFLOVA_STREAM_DESCRIPTORS_IN_STORAGE=0
build_src_filter = +<../test/scheduling-smoke/main.cpp>

[env:mqtt-smoke-esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
platform_packages = platformio/tool-esptoolpy@2.41100.0
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  -I.local/mqtt-smoke
  -DFLOVA_ESP8266_BOUNDED_TLS_RECORDS=1
build_src_filter = +<../test/mqtt-smoke/main.cpp>

[env:esp8266-touch-test]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
build_src_filter = +<../examples/esp8266-touch-test/src/main.cpp>

[env:esp8266-touch-test-ota]
platform = espressif8266@4.2.1
board = nodemcuv2
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  -DFLOVA_OTA_METADATA_ENABLED=1
  -DFLOVA_FIRMWARE_TARGET=\"esp8266-touch-test-ota\"
  -DFLOVA_OTA_BOOT_LAYOUT_VERSION=\"esp8266-staged-copy\"
  -fstack-usage
build_src_filter = +<../examples/esp8266-touch-test-ota/src/main.cpp>

[env:esp32-touch-test]
platform = espressif32@7.0.1
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/esp32-touch-test/src/main.cpp>

[env:esp32-touch-test-ble]
platform = espressif32@7.0.1
board = esp32dev
board_build.partitions = partitions/esp32-ab-4m-v1.csv
build_flags =
  ${env.build_flags}
  ${esp32_ble_profile.build_flags}
  -DFLOVA_OTA_METADATA_ENABLED=1
  -DFLOVA_FIRMWARE_TARGET=\"esp32-touch-test-ble\"
  -DFLOVA_OTA_BOOT_LAYOUT_VERSION=\"esp32-ab-4m-v1\"
build_src_filter = +<../examples/esp32-touch-test-ble/src/main.cpp>

[env:datastream-api-esp32]
platform = espressif32@7.0.1
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/datastream-api-esp32/src/main.cpp>

[env:datastream-api-esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
build_src_filter = +<../examples/datastream-api-esp8266/src/main.cpp>

[env:custom-arduino-client-esp32]
platform = espressif32@7.0.1
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/custom-arduino-client/src/main.cpp> -<../examples/custom-arduino-client/src/main-esp8266.cpp>

[env:custom-arduino-client-esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
build_src_filter = +<../examples/custom-arduino-client/src/main-esp8266.cpp> -<../examples/custom-arduino-client/src/main.cpp>

[env:custom-ethernet-esp32]
platform = espressif32@7.0.1
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/custom-ethernet-esp32/src/main.cpp>

[env:custom-arduino-provisioning-esp32]
platform = espressif32@7.0.1
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/custom-arduino-provisioning/src/main.cpp> -<../examples/custom-arduino-provisioning/src/main-esp8266.cpp>

[env:custom-arduino-provisioning-esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
build_src_filter = +<../examples/custom-arduino-provisioning/src/main-esp8266.cpp> -<../examples/custom-arduino-provisioning/src/main.cpp>

[env:test-esp32]
platform = espressif32@7.0.1
board = esp32dev
test_filter = test_datastream
build_src_filter = -<*>
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
  -DFLOVA_PARAMETER_CAPACITY=8
  -DFLOVA_LINK_TEST=1

[env:test-esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  -DFLOVA_PARAMETER_CAPACITY=4
  -DFLOVA_LINK_TEST=1
test_filter = test_datastream
build_src_filter = -<*>

[env:test-config-rollback-esp8266]
extends = env:test-esp8266
test_filter = test_configuration_rollback

[env:wifi-recovery-serial-esp32]
